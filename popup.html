<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美術展カレンダー登録</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>美術展カレンダー登録</h1>

    <!-- API Key設定 -->
    <div class="settings-section" id="settingsSection">
      <label for="apiKey">Claude API Key:</label>
      <div class="api-key-input">
        <input type="password" id="apiKey" placeholder="sk-ant-...">
        <button id="saveApiKey" class="btn-secondary">保存</button>
      </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="main-section">
      <button id="extractBtn" class="btn-primary">情報を抽出</button>

      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <span>抽出中...</span>
      </div>

      <div id="error" class="error hidden"></div>

      <div id="resultSection" class="result-section hidden">
        <div class="form-group">
          <label for="title">タイトル:</label>
          <input type="text" id="title">
        </div>

        <div class="form-group">
          <label for="startDate">開始日:</label>
          <input type="date" id="startDate">
        </div>

        <div class="form-group">
          <label for="endDate">終了日:</label>
          <input type="date" id="endDate">
        </div>

        <div class="form-group">
          <label for="location">場所:</label>
          <input type="text" id="location">
        </div>

        <div class="form-group">
          <label for="description">概要:</label>
          <textarea id="description" rows="3"></textarea>
        </div>

        <div class="form-group">
          <label for="url">URL:</label>
          <input type="text" id="url" readonly>
        </div>

        <button id="registerBtn" class="btn-primary">Googleカレンダーに登録</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
